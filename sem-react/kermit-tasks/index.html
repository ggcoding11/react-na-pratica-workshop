<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <title>Kermit Tasks</title>
  </head>
  <body
    class="min-vh-100 d-flex flex-column align-items-center justify-content-center"
  >
    <div class="bg-white rounded-8 p-8 w-100" id="main">
      <div class="d-flex flex-column align-items-center gap-4 w-100 mb-4">
        <div class="d-flex justify-content-center align-items-center gap-2">
          <img
            class="img-fluid w-3"
            src="https://img.icons8.com/?size=100&id=rn0oscjrJY2d&format=png&color=000000"
            alt="icon"
          />

          <h1>Kermit Tasks</h1>
        </div>

        <p class="fs-lg fw-semibold">Gerencie as suas tarefas diárias</p>

        <button
          data-bs-toggle="dialog"
          data-bs-target="#dialog-add-tarefa"
          type="button"
          class="btn-solid theme-primary w-100 py-4"
        >
          <i class="bi bi-plus-square"></i>
          Adicione uma tarefa
        </button>
      </div>

      <div class="d-flex flex-column gap-4" id="lista-tarefas">
        <!-- <div class="tarefa bg-white border rounded-6 d-flex justify-content-between p-6">
          <div class="d-flex gap-4">
            <i class="bi bi-circle clicavel"></i>
            <span>Estudar Java</span>
          </div>

          <i class="delete-button bi bi-trash clicavel fs-lg"></i>
        </div> -->
      </div>
    </div>

    <dialog class="dialog" id="dialog-add-tarefa">
      <form id="form-add-tarefa">
        <div class="dialog-header">
          <h1 class="dialog-title">Adicione uma tarefa</h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="dialog"
            aria-label="Close"
          ></button>
        </div>
        <div class="dialog-body">
          <div class="form-field">
            <label for="input-nome-tarefa" class="form-label"
              >Nome da tarefa:</label
            >
            <input
              type="text"
              class="form-control"
              id="input-nome-tarefa"
              placeholder="Estudar Java"
              required
            />
          </div>
        </div>
        <div class="dialog-footer">
          <button
            type="button"
            class="btn-solid theme-secondary"
            data-bs-dismiss="dialog"
          >
            Fechar
          </button>
          <button type="submit" class="btn-solid theme-primary">Salvar</button>
        </div>
      </form>
    </dialog>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
