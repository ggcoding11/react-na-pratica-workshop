<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <title>Kermit Tasks</title>
  </head>
  <body>
    <div
      class="min-vh-100 d-flex flex-column align-items-center justify-content-center"
      id="main"
    >
      <div class="text-center mb-4">
        <h1>Kermit Tasks</h1>

        <p>Gerencie as suas tarefas diárias</p>

        <button
          data-bs-toggle="dialog"
          data-bs-target="#exampleDialog"
          type="button"
          class="btn-solid theme-primary"
        >
          <i class="bi bi-plus-square"></i>
          Adicione uma tarefa
        </button>
      </div>

      <div id="lista-tarefas">

      </div>
    </div>

    <dialog class="dialog" id="exampleDialog">
      <form id="form-add-tarefa">
        <div class="dialog-header">
          <h1 class="dialog-title">Adicione uma tarefa</h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="dialog"
            aria-label="Close"
          ></button>
        </div>
        <div class="dialog-body">
          <div class="form-field">
            <label for="input-nome-tarefa" class="form-label"
              >Nome da tarefa:</label
            >
            <input
              type="text"
              class="form-control"
              id="input-nome-tarefa"
              placeholder="Estudar Java"
              required
            />
          </div>
        </div>
        <div class="dialog-footer">
          <button
            type="button"
            class="btn-solid theme-secondary"
            data-bs-dismiss="dialog"
          >
            Fechar
          </button>
          <button
            type="submit"
            class="btn-solid theme-primary"
          >
            Salvar
          </button>
        </div>
      </form>
    </dialog>

    <script src="./script.js"></script>
  </body>
</html>
